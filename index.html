<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#d81b7a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="يوغا"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>تحضير اليوغا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, RTL; a lesson is a list, a pose is a 3-step card flow (موانع → استخدام → أداء). */
:root{
  --bg:#f7f3f6; --surface:#ffffff; --sunk:#efe8ed; --ink:#1d2340; --muted:#5e6178; --line:#e2d8df;
  --brand:#d81b7a; --brand-ink:#ffffff; --brand-soft:#fbe3ef;
  --ok:#1f7a55; --ok-soft:#dff3ea; --bad:#b4322c; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fdf0d3;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14162a; --surface:#1d2038; --sunk:#262a47; --ink:#eef0fa; --muted:#a6a9c2; --line:#33375a;
  --brand:#ff5aa8; --brand-ink:#1a0c14; --brand-soft:#3d1f35;
  --ok:#5fd3a0; --ok-soft:#173a2e; --bad:#ff8a80; --bad-soft:#43201f; --warn:#f2c060; --warn-soft:#3b3015; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14162a; --surface:#1d2038; --sunk:#262a47; --ink:#eef0fa; --muted:#a6a9c2; --line:#33375a;
  --brand:#ff5aa8; --brand-ink:#1a0c14; --brand-soft:#3d1f35;
  --ok:#5fd3a0; --ok-soft:#173a2e; --bad:#ff8a80; --bad-soft:#43201f; --warn:#f2c060; --warn-soft:#3b3015; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-block:8px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600}
.top .t{font-weight:600;color:var(--muted);font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{background:#fff;border-radius:12px;padding:6px 10px;width:150px}
.logo img{display:block;width:100%}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--brand);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.lesson{text-align:start;width:100%}
.lesson .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.num{font-family:var(--display);font-size:2rem;color:var(--brand);line-height:1}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.small{font-size:.875rem}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.br{background:var(--brand-soft);color:var(--brand)}
.poses{display:flex;flex-direction:column;gap:10px}
.pose-btn{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;text-align:start;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.pose-btn img{width:72px;height:56px;object-fit:cover;border-radius:8px;background:#fff}
.pose-btn .nm{font-weight:600;min-width:0}
.breath{background:var(--brand-soft);border:none}
.breath ol,.steps{margin:0;padding-inline-start:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.breath li,.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.breath li::before,.steps li::before{content:counter(s,arabic-indic);font-family:var(--display);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-size:.9rem}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--brand);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
.stepper{display:flex;gap:6px}
.stepper span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stepper span.on{background:var(--brand)}
.scenario{border-inline-start:4px solid var(--brand);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0}
.q{font-weight:700;font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:start;width:100%}
.opt .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-top:3px;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt.radio .box{border-radius:50%}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.good .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.miss{border-color:var(--warn);border-style:dashed;background:var(--warn-soft)} .opt.miss .box{border-color:var(--warn);color:var(--warn)}
.opt[disabled]{cursor:default}
.tag{font-size:.75rem;font-weight:700;margin-inline-start:auto;white-space:nowrap;padding-inline-start:8px}
.good .tag{color:var(--ok)} .wrong .tag{color:var(--bad)} .miss .tag{color:var(--warn)}
.fb{padding:10px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:none;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:12px 18px;border-radius:12px;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btns{display:flex;gap:10px} .btns .btn{flex:1}
.photo{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.photo img{display:block;width:100%;max-height:340px;object-fit:contain}
.photo video{display:block;width:100%;max-height:420px;background:#000}
.lock{opacity:.55}
.kv{display:flex;flex-direction:column;gap:8px}
.kv div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.kv b{color:var(--brand);white-space:nowrap}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.contra-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:80px;resize:vertical}
.answer{background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:10px 14px}
.answer b{color:var(--ok)}
.hwq{gap:12px}
.qnum{font-family:var(--display);color:var(--brand)}
.note{font-size:.85rem;color:var(--muted);text-align:center}
.timer{align-items:center;text-align:center}
.ring{position:relative;width:210px;aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--sunk)}
.ring .prog{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;gap:4px}
.ring .sec{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-weight:700;color:var(--brand);min-height:1.6em}
.ring.breathe-in .prog{stroke-width:15}
.motiv{min-height:3.4em;font-weight:600;max-width:32ch}
.durs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.durs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:600}
.durs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.durs button[disabled]{opacity:.5;cursor:default}
.celebrate{background:var(--ok-soft);border-color:transparent;text-align:center;align-items:center}
.celebrate h2{color:var(--ok)}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--sunk);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-size:1.5rem;color:var(--brand);line-height:1.2}
.stats span{font-size:.75rem;color:var(--muted)}
.motd{background:var(--brand);color:var(--brand-ink);border:none}
.motd p{font-family:var(--display);font-size:1.15rem;line-height:1.6}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.pts{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts::before{content:"★"}
.rank{display:flex;flex-direction:column;gap:8px}
.rank .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank .score{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.rank .title{font-family:var(--display);font-size:1.2rem}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);font-weight:700;padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast b{color:var(--brand)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop 2.6s ease forwards}@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}}
.earned{font-family:var(--display);font-size:1.6rem;color:var(--brand)}
.ladder{display:flex;gap:4px}
.ladder span{flex:1;font-size:.7rem;text-align:center;color:var(--muted);padding-top:6px;border-top:4px solid var(--line)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.lb li.me{background:var(--brand-soft);outline:2px solid var(--brand)}
.lb .pos{font-family:var(--display);font-size:1.2rem;text-align:center}
.lb .who{display:flex;flex-direction:column;min-width:0;line-height:1.4}
.lb .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-family:var(--display);font-size:1.3rem;color:var(--brand);font-variant-numeric:tabular-nums}
input:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.ladder span.on{color:var(--brand);border-color:var(--brand);font-weight:700}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

</head><body><div id="app" dir="rtl" lang="ar"></div>

function confetti(){

  const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--brand"),cs.getPropertyValue("--ok"),cs.getPropertyValue("--warn"),"#6c8cff"];
  const P=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++f<120)requestAnimationFrame(tick);else c.remove();})();
}

let boardTab="s",boardList=null;
function drawBoard(){
  const bl=document.getElementById("bl");if(!bl||!boardList)return;
  const medal=["🥇","🥈","🥉"];
  if(boardTab==="g"){
    const G={};boardList.forEach(s=>{const g=s.group||"بلا مجموعة";(G[g]=G[g]||{name:g,points:0,n:0});G[g].points+=Number(s.points)||0;G[g].n++;});
    const gl=Object.values(G).sort((a,b)=>b.points-a.points);
    bl.innerHTML=gl.length?`<ol class="lb">${gl.map((g,i)=>{const me=g.name===S.group;return `<li class="${me?"me":""}"><span class="pos">${medal[i]||AR(i+1)}</span><span class="who"><b>${esc(g.name)}${me?" (مجموعتك)":""}</b><span class="small muted">${AR(g.n)} طلاب</span></span><span class="sc">${AR(g.points)}</span></li>`;}).join("")}</ol>`:`<p class="muted">لسّا ما في مجموعات.</p>`;
  }else{
    bl.innerHTML=boardList.length?`<ol class="lb">${boardList.map((s,i)=>{const me=s.name===S.name&&String(s.group||"")===String(S.group||"");
      return `<li class="${me?"me":""}"><span class="pos">${medal[i]||AR(i+1)}</span><span class="who"><b>${esc(s.name)}${me?" (إنت)":""}</b><span class="small muted">${esc(s.rank||"")}${s.group?" · "+esc(s.group):""}</span></span><span class="sc">${AR(s.points)}</span></li>`;}).join("")}</ol>`:`<p class="muted">لسّا ما حدا جمع نقاط. كن الأوّل!</p>`;

let levelSel=1;
function pose(i,k){
  stopTimer();
  const P=POSES[i],st=ps(i),L=LESSONS[k];
  const pos=L.poses.indexOf(i),next=L.poses[pos+1];
  const cOpts=shuffled([...P.contra.map(t=>({t,ok:true})),...P.distract.map(t=>({t,ok:false}))],i+3);
  const uOpts=shuffled([{t:P.use,ok:true},...P.useD.map(j=>({t:POSES[j].use,ok:false}))],i+11);
  const sel=st.contraSel||[];
  const contraOk=st.contraDone&&cOpts.every(([o,idx])=>o.ok===sel.includes(idx));
  const useOk=st.useDone&&uOpts.some(([o,idx])=>idx===st.useSel&&o.ok);
  const stage=(st.contraDone?1:0)+(st.useDone?1:0)+(st.done?1:0);

  const contraHTML=cOpts.map(([o,idx])=>{
    let cls="opt",tag="";const on=sel.includes(idx);
    if(st.contraDone){ if(o.ok&&on){cls+=" good";tag="صح"} else if(!o.ok&&on){cls+=" wrong";tag="مش مانع"} }
    else if(on)cls+=" sel";
    return `<button class="${cls}" data-c="${idx}" ${st.contraDone?"disabled":""} aria-pressed="${on}"><span class="box">${on?(st.contraDone&&!o.ok?"✗":"✓"):""}</span><span>${esc(o.t)}</span>${tag?`<span class="tag">${tag}</span>`:""}</button>`;}).join("");
  const nCorrect=P.contra.length;
  let contraFb="";
  if(st.contraDone){const perfect=cOpts.every(([o,idx])=>o.ok===sel.includes(idx));
    contraFb=perfect?`<div class="fb ok">ممتاز! عرفت كل الموانع.</div>`:`<div class="fb bad">${P.contra.filter((_,j)=>!sel.includes(j)).length?"في موانع فاتوك":"في جواب مش مانع"}. جرّب كمان مرة لتشوف الفيديو.</div>`;}

  const uHTML=uOpts.map(([o,idx])=>{let cls="opt radio",tag="";const on=st.useSel===idx;
    const showOk=st.useDone&&o.ok&&on;
    if(st.useDone){if(showOk){cls+=" good";tag="صح"}else if(on){cls+=" wrong";tag="لأ"}}
    return `<button class="${cls}" data-u="${idx}" data-ok="${o.ok?1:0}" ${st.useDone?"disabled":""}><span class="box">${st.useDone&&on?(o.ok?"✓":"✗"):""}</span><span>${esc(o.t)}</span>${tag?`<span class="tag">${tag}</span>`:""}</button>`;}).join("");

  const ready=contraOk&&useOk;
  const lv=["سهل","متوسط","متقدم"];
  app.innerHTML=`<div class="view" style="display:flex;flex-direction:column;gap:18px">${topbar("الدرس "+AR(k+1)+" · "+L.title,"lesson:"+k)}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="stepper" aria-hidden="true"><span class="${stage>=0?"on":""}"></span><span class="${stage>=1?"on":""}"></span><span class="${ready?"on":""}"></span></div>
    <h1>${esc(P.name)}</h1>
  </div>
  <div class="scenario"><b>السيناريو:</b> ${esc(P.scenario)}</div>

  <section class="card"><span class="eyebrow">السؤال ١</span>
    <p class="q">شو الموانع اللي بتمنع أداء هالوضعية؟</p>
    <p class="small muted">اختار كل الأجوبة الصح (في ${AR(nCorrect)}).</p>
    <div class="opts">${contraHTML}</div>
    ${st.contraDone?contraFb+(contraOk?"":`<button class="btn ghost" data-act="retryC">جرّب من جديد</button>`):`<button class="btn" data-act="checkC" ${sel.length?"":"disabled"}>تحقّق</button>`}
  </section>

  <section class="card"><span class="eyebrow">السؤال ٢</span>
    <p class="q">ليش منستعمل هالتمرين بالحياة؟</p>
    <div class="opts">${uHTML}</div>
    ${st.useDone?(uOpts.find(([o,idx])=>idx===st.useSel)[0].ok?`<div class="fb ok">صح!</div>`:`<div class="fb bad">غلط. فكّر منيح وجرّب كمان مرة.</div><button class="btn ghost" data-act="retryU">جرّب من جديد</button>`):""}
  </section>

  ${ready?`<section class="card"><span class="eyebrow">طريقة الأداء</span>
    ${P.video?`<div class="photo vid"><video controls playsinline preload="metadata" poster="${IMG[P.img]}" src="${P.video}"></video></div>`:`<div class="photo"><img src="${IMG[P.img]}" alt="${esc(P.name)}"></div>`}
    <ol class="steps">${P.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>
    ${P.warn?`<div class="fb bad small">${esc(P.warn)}</div>`:""}
  </section>
  <section class="card"><span class="eyebrow">المستوى</span>
    <div class="seg" role="group" aria-label="المستوى">${lv.map((n,j)=>`<button data-lv="${j}" aria-pressed="${levelSel===j}">${n}</button>`).join("")}</div>
    <p>${esc(P.levels[levelSel])}</p>
  </section>
  <section class="card"><span class="eyebrow">الفائدة</span><p>${esc(P.benefit)}</p>
    <span class="eyebrow">التعديلات إذا في وجع</span>
    <div class="kv">${P.mods.map(m=>`<div><b>${esc(m[0])}:</b><span>${esc(m[1])}</span></div>`).join("")}</div>
    <span class="eyebrow">الموانع</span>
    <ul class="contra-list">${P.contra.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
  </section>
  ${celebrate===i?`<section class="card celebrate"><span class="big">✓</span><h2>${pick(PRAISE)}</h2><span class="earned">+${AR(st.lastPts||0)} نقطة</span><p>خلّصت <b>${esc(P.name)}</b> لمدة ${AR(st.lastSecs||0)} ثانية. مجموعك صار ${AR(S.pts)}.</p>${next!==undefined?`<p class="small">يلّا عالوضعية اللي بعدها!</p>`:`<p class="small">خلّصت آخر وضعية بالدرس!</p>`}</section>`:""}
  <section class="card timer" id="timer"><span class="eyebrow">عدّاد التمرين</span>
    <div class="durs" role="group" aria-label="المدة">${[20,30,45,60,90].map(d=>`<button data-dur="${d}" aria-pressed="${d===(st.dur||[30,45,60][levelSel])}">${AR(d)} ث</button>`).join("")}</div>
    <div class="ring" id="ring"><svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="88"/><circle class="prog" id="prog" cx="100" cy="100" r="88" stroke-dasharray="552.9" stroke-dashoffset="0"/></svg>
      <div class="mid"><span class="sec" id="sec">${AR(st.dur||[30,45,60][levelSel])}</span><span class="phase" id="phase">جاهز؟</span></div></div>
    <p class="motiv" id="motiv">خلّي التلفون قدّامك، واكبس ابدأ لمّا تكون بالوضعية.</p>
    <div class="btns" style="width:100%"><button class="btn" id="tStart">ابدأ</button><button class="btn ghost" id="tReset">إعادة</button></div>
  </section>
  ${st.done?`<div class="fb ok">نفّذت هالوضعية.</div>`:""}
  <div class="btns">${!st.done?`<button class="btn ghost lock" disabled>🔒 خلّص العدّاد لتنتقل ${next!==undefined?"للوضعية التالية":"للواجب"}</button>`:next!==undefined?`<button class="btn" data-go="pose:${next}:${k}">الوضعية التالية ←</button>`:`<button class="btn" data-go="hw:${k}">للواجب المنزلي ←</button>`}</div>`
  :`<p class="note">🔒 جاوب صح عالسؤالين لتشوف ${P.video?"الفيديو":"الصورة"} وطريقة الأداء.</p>`}
  </div>`;

  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const idx=+b.dataset.c;const s=st.contraSel||(st.contraSel=[]);const at=s.indexOf(idx);at>=0?s.splice(at,1):s.push(idx);save();pose(i,k);});
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{st.useSel=+b.dataset.u;st.useDone=true;
    if(!S.awarded["u"+i]){S.awarded["u"+i]=1;if(b.dataset.ok==="1")award(10,"عرفت ليش منستعمل التمرين");}
    save();pose(i,k);});
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{levelSel=+b.dataset.lv;pose(i,k);});
  const act=a=>app.querySelector(`[data-act="${a}"]`);
  if(act("checkC"))act("checkC").onclick=()=>{st.contraDone=true;
    const s=st.contraSel||[];const perfect=cOpts.every(([o,idx])=>o.ok===s.includes(idx));
    if(!S.awarded["c"+i]){S.awarded["c"+i]=1;if(perfect)award(10,"عرفت كل الموانع");}
    save();pose(i,k);};
  if(act("retryC"))act("retryC").onclick=()=>{st.contraDone=false;st.contraSel=[];save();pose(i,k);};
  if(act("retryU"))act("retryU").onclick=()=>{st.useDone=false;st.useSel=null;save();pose(i,k);};
  if(act("done"))act("done").onclick=()=>{dailyBonus();st.done=true;logPractice(0);award(5,"نفّذت "+P.name);lessonBonus();save();pose(i,k);};

  /* timer */
  const tc=document.getElementById("timer");if(!tc)return;
  const $=id=>document.getElementById(id);
  const C=552.9;let dur=st.dur||[30,45,60][levelSel];
  const draw=(left,phase)=>{$("sec").textContent=AR(Math.ceil(left));$("prog").style.strokeDashoffset=C*(1-left/dur);if(phase!==undefined)$("phase").textContent=phase;};
  tc.querySelectorAll("[data-dur]").forEach(b=>b.onclick=()=>{if(T)return;st.dur=+b.dataset.dur;save();dur=st.dur;
    tc.querySelectorAll("[data-dur]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw(dur,"جاهز؟");});
  const setDurDisabled=v=>tc.querySelectorAll("[data-dur]").forEach(x=>x.disabled=v);
  const finish=()=>{stopTimer();beep(880,180);beep(1175,260,.22);buzz([120,80,200]);
    const bonus=dailyBonus();const got=award(10+Math.round(dur/5),"نفّذت "+P.name);
    st.done=true;st.lastSecs=dur;st.lastPts=got+bonus;logPractice(dur);lessonBonus();celebrate=i;save();confetti();pose(i,k);
    const c=document.querySelector(".celebrate");c&&c.scrollIntoView({block:"center",behavior:"smooth"});};
  const run=()=>{T.end=Date.now()+T.left*1000;T.state="run";$("tStart").textContent="إيقاف مؤقت";
    let lastMot=-1;
    T.iv=setInterval(()=>{const left=Math.max(0,(T.end-Date.now())/1000);T.left=left;const el=dur-left;
      const inhale=Math.floor(el/4)%2===0;
      $("ring").classList.toggle("breathe-in",inhale);
      draw(left,inhale?"شهيق…":"زفير…");
      const m=Math.floor(el/8);
      if(left<=5&&left>0){if(lastMot!=="end"){lastMot="end";$("motiv").textContent="آخر خمس ثواني، كمّل!";}if(Math.ceil(left)!==T.lastBeep){T.lastBeep=Math.ceil(left);beep(660,90);}}
      else if(m!==lastMot){lastMot=m;$("motiv").textContent=pick(DURING);}
      if(left<=0)finish();},200);};
  $("tStart").onclick=()=>{
    if(!T){T={left:dur,state:"count"};setDurDisabled(true);celebrate=null;
      try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>{if(T)T.wl=w;else w.release();}).catch(()=>{});}catch(e){}
      let n=3;$("tStart").disabled=true;$("motiv").textContent="خود وضعية البداية…";draw(dur,"استعد "+AR(n));beep(520,120);
      const cd=setInterval(()=>{n--;if(!T){clearInterval(cd);return;}if(n>0){draw(dur,"استعد "+AR(n));beep(520,120);}else{clearInterval(cd);beep(880,200);$("tStart").disabled=false;run();}},1000);
      T.iv=cd;return;}
    if(T.state==="run"){clearInterval(T.iv);T.state="pause";$("tStart").textContent="كمّل";$("phase").textContent="متوقف";$("motiv").textContent="خود نفس، وكمّل لمّا تكون جاهز.";}
    else if(T.state==="pause"){run();}
  };
  $("tReset").onclick=()=>{stopTimer();setDurDisabled(false);$("tStart").disabled=false;$("tStart").textContent="ابدأ";$("ring").classList.remove("breathe-in");draw(dur,"جاهز؟");$("motiv").textContent="خلّي التلفون قدّامك، واكبس ابدأ لمّا تكون بالوضعية.";};
}

function hw(k){
  const L=LESSONS[k],Q=HW[L.id],ans=S.hw[L.id]||(S.hw[L.id]={});
  let lastH="";
  const body=Q.map((q,n)=>{
    const a=ans[n];let h="";
    if(q.h&&q.h!==lastH){h=`<h3>${esc(q.h)}</h3>`;}lastH=q.h||lastH;
    let inner="";
    if(q.t==="mcq"||q.t==="tf"){
      const opts=q.t==="tf"?[["صح",0],["خطأ",1]]:(q.keep?q.o.map((o,j)=>[o,j]):shuffled(q.o,n+k*17));
      const correct=q.t==="tf"?(q.a?0:1):q.a;
      inner=`<div class="opts">${opts.map(([o,j])=>{let cls="opt radio",tag="";
        if(a!==undefined){if(j===correct){cls+=" good";tag="صح"}else if(j===a){cls+=" wrong";tag="لأ"}}
        return `<button class="${cls}" data-h="${n}:${j}" ${a!==undefined?"disabled":""}><span class="box">${a!==undefined&&(j===correct||j===a)?(j===correct?"✓":"✗"):""}</span><span>${esc(o)}</span>${tag?`<span class="tag">${tag}</span>`:""}</button>`;}).join("")}</div>
        ${a!==undefined&&q.why?`<div class="answer"><b>الحل:</b> ${esc(q.why)}</div>`:""}
        ${a!==undefined&&a!==correct?`<button class="btn ghost" data-hr="${n}">جرّب من جديد</button>`:""}`;
    }else{
      const shown=a&&a.shown;
      inner=`<textarea id="hw-${L.id}-${n}" data-ht="${n}" placeholder="اكتب جوابك هون">${esc((a&&a.text)||"")}</textarea>
        ${shown?`<div class="answer"><b>الحل:</b> ${esc(q.a)}</div>`:`<button class="btn ghost" data-hs="${n}">شوف الحل</button>`}`;
    }
    return h+`<section class="card hwq"><p class="q"><span class="qnum">${AR(n+1)}.</span> ${esc(q.q)}</p>${inner}</section>`;
  }).join("");
  const scored=Q.map((q,n)=>q.t!=="open"&&ans[n]!==undefined?((q.t==="tf"?(q.a?0:1):q.a)===ans[n]):null).filter(x=>x!==null);
  const nObj=Q.filter(q=>q.t!=="open").length;
  app.innerHTML=`<div class="view" style="display:flex;flex-direction:column;gap:14px">${topbar("الدرس "+AR(k+1)+" · الواجب","lesson:"+k)}
   <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">الواجب المنزلي</span><h1>${esc(L.title)}</h1>
   <span class="chip br" style="align-self:flex-start">${AR(scored.filter(Boolean).length)} صح من ${AR(nObj)}</span></div>
   ${body}
   <button class="btn ghost" data-go="lesson:${k}">رجوع عالدرس</button></div>`;
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const [n,j]=b.dataset.h.split(":").map(Number);ans[n]=j;
    const q=Q[n],correct=q.t==="tf"?(q.a?0:1):q.a,key="h"+L.id+"-"+n;
    if(!S.awarded[key]){S.awarded[key]=1;if(j===correct)award(5,"جواب صح");}
    save();const y=scrollY;hw(k);scrollTo(0,y);});
  app.querySelectorAll("[data-hr]").forEach(b=>b.onclick=()=>{delete ans[+b.dataset.hr];save();const y=scrollY;hw(k);scrollTo(0,y);});
  app.querySelectorAll("[data-hs]").forEach(b=>b.onclick=()=>{const n=+b.dataset.hs;const ta=app.querySelector(`[data-ht="${n}"]`);ans[n]={text:ta.value,shown:true};save();const y=scrollY;hw(k);scrollTo(0,y);});
  app.querySelectorAll("[data-ht]").forEach(t=>t.oninput=()=>{const n=+t.dataset.ht;ans[n]=Object.assign(ans[n]||{},{text:t.value});save();});
}

/* ---------- router ---------- */
function go(r,keepScroll){
  stopTimer();celebrate=null;
  const [v,a,b]=r.split(":");
  if(v==="help")help();else if(v==="board")board();else if(v==="name")nameForm(true);else if(v==="lesson")lesson(+a);else if(v==="pose"){if(!keepScroll)levelSel=1;pose(+a,+b);}else if(v==="hw")hw(+a);else home();
  if(!keepScroll)scrollTo(0,0);
}
app.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t)go(t.dataset.go);});
/* keep scroll position when a pose re-renders after an answer */
const _pose=pose;pose=function(i,k){const y=scrollY;_pose(i,k);scrollTo(0,y);};
/* ---------- install as an app (only on the hosted site, not inside a preview) ---------- */
let deferredPrompt=null;
const inFrame=(()=>{try{return window.top!==window.self}catch(e){return true}})();
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function renderInstall(){
  const el=document.getElementById("install");if(!el)return;
  if(inFrame||standalone||!/^https?:/.test(location.protocol)){el.innerHTML="";return;}
  if(deferredPrompt){el.innerHTML=`<section class="card" style="flex-direction:row;align-items:center;gap:12px"><div style="flex:1;min-width:0"><b>نزّل التطبيق عالتلفون</b><p class="small muted">بيفتح متل أي تطبيق، وبيشتغل بلا إنترنت.</p></div><button class="btn" style="width:auto" id="doInstall">تنزيل</button></section>`;
    document.getElementById("doInstall").onclick=async()=>{deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;renderInstall();};}
  else if(isIOS){el.innerHTML=`<details class="card"><summary>نزّل التطبيق عالآيفون</summary><ol class="steps"><li><span>افتح هالصفحة بـ Safari.</span></li><li><span>اكبس زر المشاركة (المربّع مع السهم لفوق).</span></li><li><span>اختار «إضافة إلى الشاشة الرئيسية» (Add to Home Screen).</span></li></ol></details>`;}
  else{el.innerHTML=`<details class="card"><summary>نزّل التطبيق عالتلفون</summary><ol class="steps"><li><span>افتح هالصفحة بـ Chrome.</span></li><li><span>اكبس النقاط التلاتة فوق.</span></li><li><span>اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</span></li></ol></details>`;}
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstall();});
addEventListener("appinstalled",()=>{deferredPrompt=null;renderInstall();});
if("serviceWorker" in navigator&&!inFrame&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});}
const _home=home;home=function(){_home();renderInstall();};
home();
</script>
